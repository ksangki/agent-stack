<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="한 요청의 경로 — 입력 등급에서 결과를 볼 수 있는 사람까지" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>한 요청의 경로 — 입력 등급에서 결과를 볼 수 있는 사람까지</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="490" fill="#F5F6F8"/><text fill="#5F6880" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="20.0" y="40.0">「조직 에이전트 2027」 6장의 규칙</tspan></text><text fill="#B07812" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="582.0" y="40.0">이 장이 더하는 것</tspan></text><rect x="20" y="60" width="140" height="150" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="90.0" y="131.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">① 입력 등급 판정</text><text x="90.0" y="152.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">조직 등급표</text><path d="M163,135 L181,135" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="184" y="60" width="140" height="150" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="254.0" y="122.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">② 허용 위치</text><text x="254.0" y="143.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">대표 구성 중 허용된</text><text x="254.0" y="160.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">구성</text><path d="M327,135 L345,135" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="348" y="60" width="140" height="150" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="418.0" y="141.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">③ 모델 처리</text><path d="M491,135 L509,135" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="512" y="60" width="140" height="150" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="582.0" y="122.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">④ 출력 등급 상속</text><text x="582.0" y="143.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">답·로그·메모리에</text><text x="582.0" y="160.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">입력 최고 등급</text><path d="M655,135 L673,135" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="676" y="60" width="140" height="150" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="746.0" y="111.8" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑤ 결과를 볼 수</text><text x="746.0" y="133.4" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">있는 사람</text><text x="746.0" y="154.3" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">요청자·채널의</text><text x="746.0" y="171.2" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">authz 조건</text><path d="M819,135 L837,135" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="840" y="60" width="140" height="150" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="910.0" y="122.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑥ 기록</text><text x="910.0" y="143.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">처리 이력·감사,</text><text x="910.0" y="160.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">기록에도 등급</text><rect x="110" y="250" width="220" height="74" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="220.0" y="283.2" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">폴백 방향</text><text x="220.0" y="303.5" fill="#5F6880" font-size="12.0" font-weight="400" text-anchor="middle">더 안쪽 위치 또는 처리 실패</text><path d="M254,214 L254,246" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="20" y="350" width="480" height="122" rx="14" fill="none" stroke="#B4BBC8" stroke-width="1.8" stroke-dasharray="7 6"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="36.0" y="370.0">게이트웨이·DLP를 비켜 가는 경로</tspan></text><rect x="36" y="382" width="220" height="76" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="146.0" y="408.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">DLP가 검사하지 않는 입력</text><text x="146.0" y="428.2" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">직접 올린 파일 · base64 이미지 ·</text><text x="146.0" y="443.7" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">외부 URL</text><rect x="268" y="382" width="220" height="76" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="378.0" y="398.5" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">게이트웨이를 거치지 않는</text><text x="378.0" y="418.7" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">경로</text><text x="378.0" y="438.3" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">개발자 기기의 MCP · 웹 검색 ·</text><text x="378.0" y="453.8" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">텔레메트리</text><path d="M430,346 L430,218" fill="none" stroke="#B07812" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#mc)"/><text fill="#5F6880" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="560.0" y="420.0">점선: 규칙표가 모델 호출만 다스리면 이 경로가 빠진다</tspan></text></svg>