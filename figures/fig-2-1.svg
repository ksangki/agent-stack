<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="배치 위치 6분류와 신뢰 근거" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>배치 위치 6분류와 신뢰 근거</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="600" fill="#F5F6F8"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="24.0" y="30.0">↑ 조직이 지는 통제 책임 (위로 갈수록 많다)</tspan></text><path d="M110,515 L110,52" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M110,515 L965,515" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="140" y="66" width="820" height="112" rx="14" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.8" stroke-dasharray="7 6"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="162.0" y="111.9">조직(또는 기기 관리)이 스스로</tspan><tspan x="162.0" y="132.1">운영하는 위치</tspan></text><rect x="430" y="90" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="545.0" y="117.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">사내</text><text x="545.0" y="140.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">조직 자신의 운영 기록</text><rect x="700" y="90" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="815.0" y="117.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">온디바이스</text><text x="815.0" y="140.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">기기 관리 정책·플랫폼 문서</text><line x1="140" y1="200" x2="960" y2="200" stroke="#B4BBC8" stroke-width="1.8" stroke-dasharray="5 5"/><rect x="170" y="290" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="275.0" y="317.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">사설 클라우드</text><text x="275.0" y="340.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">계약형</text><rect x="170" y="420" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="275.0" y="458.4" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">퍼블릭 클라우드</text><rect x="440" y="360" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="545.0" y="398.4" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">인가 경계 클라우드</text><rect x="710" y="290" width="230" height="64" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="825.0" y="317.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">사설 클라우드</text><text x="825.0" y="340.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">기밀 컴퓨팅형</text><line x1="275" y1="509" x2="275" y2="521" stroke="#1D2742" stroke-width="2"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" y="545.0">사업자 운영을 믿는다</tspan></text><line x1="545" y1="509" x2="545" y2="521" stroke="#1D2742" stroke-width="2"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="545.0" y="545.0">제3자 인가를 믿는다</tspan></text><line x1="825" y1="509" x2="825" y2="521" stroke="#1D2742" stroke-width="2"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="825.0" y="545.0">하드웨어 증명을 검증한다</tspan></text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="965.0" y="580.0">신뢰 근거 →  (2026년 10월 기준 공개 자료로 재구성한 예시)</