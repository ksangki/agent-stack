<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-label="예산 계층과 계층마다의 집행 지연" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>예산 계층과 계층마다의 집행 지연</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="590" fill="#F5F6F8"/><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="40.0" y="36.0">계층</tspan></text><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="36.0">한도 종류</tspan></text><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="735.0" y="36.0">집행 지연</tspan></text><line x1="30" y1="50" x2="980" y2="50" stroke="#B4BBC8" stroke-width="1.8"/><rect x="40" y="64" width="320" height="62" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="200.0" y="91.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">① 제공자 조직</text><text x="200.0" y="112.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">마지막 차단막</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="95.0">하드 한도(429) · 알림</tspan></text><rect x="40" y="138" width="320" height="62" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="175.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">② 워크스페이스·프로젝트</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="159.2">월 한도 · 알림 (Anthropic Default</tspan><tspan x="390.0" y="178.8">Workspace는 한도 불가)</tspan></text><rect x="40" y="212" width="320" height="62" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="249.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">③ 팀</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="233.2">게이트웨이 예산: 하드 · 경고 · 스로틀, 자동</tspan><tspan x="390.0" y="252.8">다운그레이드</tspan></text><rect x="40" y="286" width="320" height="62" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="323.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">④ 키</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="317.0">가상 키 예산, 분당 토큰·요청 한도</tspan></text><rect x="40" y="360" width="320" height="62" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="397.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑤ 기능(헤더)</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="391.0">기능 단위 사용량 관측, 필요하면 한도</tspan></text><rect x="40" y="434" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="115.0" y="470.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑥ 사용자</text><text x="115.0" y="491.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">개인별 한도</text><rect x="205" y="434" width="155" height="80" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="282.5" y="470.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑦ 에이전트</text><text x="282.5" y="491.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">전용 키 · 전용 예산</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="390.0" y="464.2">사용자는 개인별 한도, 에이전트는 사람 한도와</tspan><tspan x="390.0" y="483.8">별도인 전용 키·팀 예산</tspan></text><text fill="#B07812" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="282.0" y="538.0">사람 한도가 걸리지 않는 주체</tspan></text><rect x="735" y="64" width="240" height="136" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="855.0" y="119.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">제공자 집계</text><text x="855.0" y="140.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">즉시 아님("not instantaneous") —</text><text x="855.0" y="157.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">한도를 넘은 뒤에 멈춘다</text><rect x="735" y="212" width="240" height="302" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="855.0" y="350.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">게이트웨이 요청 시점</text><text x="855.0" y="371.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">사용자 한도를 제공자 기능으로 걸면</text><text x="855.0" y="388.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">제공자 집계를 따른다</text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="975.0" y="575.0">2026년 10월 기준 공개 문서로 구성한 예시</tspan></text></svg>