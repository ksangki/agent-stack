<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="권한을 승인하는 시스템의 세 안과 기록이 남는 곳" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>권한을 승인하는 시스템의 세 안과 기록이 남는 곳</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="480" fill="#F5F6F8"/><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" y="34.0">에이전트</tspan></text><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="390.0" y="34.0">권한을 승인하는 시스템</tspan></text><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="665.0" y="34.0">SoR</tspan></text><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="880.0" y="34.0">위임 기록·감사 로그</tspan></text><line x1="20" y1="52" x2="980" y2="52" stroke="#B4BBC8" stroke-width="1.8"/><text fill="#B07812" font-size="15.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="78.0">① 벤더 SoR 안</tspan></text><rect x="30" y="92" width="150" height="86" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="105.0" y="141.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">에이전트</text><rect x="250" y="92" width="490" height="86" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="495.0" y="131.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">벤더 SoR</text><text x="495.0" y="152.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">SoR의 권한·공유 규칙으로 승인한다</text><path d="M184,135 L246,135" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="780" y="92" width="200" height="86" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="880.0" y="123.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">벤더 시스템</text><text x="880.0" y="143.2" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">벤더를 바꾸면 위임 이력이 남지</text><text x="880.0" y="158.7" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">않을 수 있다</text><text fill="#B07812" font-size="15.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="210.0">② 조직 IdP·게이트웨이</tspan></text><rect x="30" y="224" width="150" height="86" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="105.0" y="273.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">에이전트</text><rect x="250" y="224" width="280" height="86" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="390.0" y="263.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">조직 IdP·게이트웨이</text><text x="390.0" y="284.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">조직이 정한 규칙으로 SoR 앞에서</text><rect x="590" y="224" width="150" height="86" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="665.0" y="273.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">SoR</text><path d="M184,267 L246,267" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M534,267 L586,267" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="780" y="224" width="200" height="86" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="880.0" y="253.2" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">조직의 게이트웨이·IdP</text><text x="880.0" y="273.5" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">로그</text><text x="880.0" y="293.1" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">벤더가 바뀌어도 조직에 남는다</text><text fill="#B07812" font-size="15.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="342.0">③ 제3자 권한 계층</tspan></text><rect x="30" y="356" width="150" height="86" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="105.0" y="394.2" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">여러 벤더</text><text x="105.0" y="415.8" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">에이전트</text><rect x="250" y="356" width="280" height="86" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="390.0" y="395.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">제3자 권한 계층</text><text x="390.0" y="416.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">여러 벤더 에이전트를 가로질러</text><rect x="590" y="356" width="150" height="86" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="665.0" y="405.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">SoR</text><path d="M184,399 L246,399" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M534,399 L586,399" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="780" y="356" width="200" height="86" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="880.0" y="395.4" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">제3자 시스템</text><text x="880.0" y="414.9" fill="#5F6880" font-size="11.5" font-weight="400" text-anchor="middle">제3자 제품이 새 교체 대상이 된다</text></svg>