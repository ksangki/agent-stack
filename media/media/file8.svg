<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="세 갈래와 대표 위험 근거" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>세 갈래와 대표 위험 근거</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="470" fill="#F5F6F8"/><path d="M60,82 L940,82" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)" marker-start="url(#mi)"/><circle cx="180" cy="82" r="8" fill="#3A4A72"/><text fill="#1D2742" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="180.0" y="48.0">사서 쓰기</tspan></text><circle cx="500" cy="82" r="8" fill="#B07812"/><text fill="#1D2742" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="48.0">벤더가 만들어 주기(FDE)</tspan></text><circle cx="820" cy="82" r="8" fill="#3A4A72"/><text fill="#1D2742" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="820.0" y="48.0">만들어 쓰기</tspan></text><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="40.0" y="122.0">대표 위험 근거 [출처 성격]</tspan></text><rect x="35" y="140" width="290" height="128.0" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="180.0" y="179.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">벤더가 데이터 접근을 좁히면 그</text><text x="180.0" y="200.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">마찰을 그대로 떠안는다</text><text x="180.0" y="223.5" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">[공식] 예: Slack API 제한 2025-05-29</text><text x="180.0" y="241.8" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">(6장)</text><rect x="355" y="140" width="290" height="128.0" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="500.0" y="188.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">2028년까지 기업 70%가 FDE로 만든</text><text x="500.0" y="209.7" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">에이전틱 AI를 포기한다는 예측</text><text x="500.0" y="232.7" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">[애널리스트] Gartner 2026-09-29</text><rect x="675" y="140" width="290" height="128.0" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="188.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">자체 구축 4곳 중 3곳이 실패한다는</text><text x="820.0" y="209.7" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">예측(2025년 대상)</text><text x="820.0" y="232.7" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">[애널리스트] Forrester 2024-10-22</text><rect x="675" y="288" width="290" height="128.0" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="336.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">LLM이 만든 코드 샘플 45%가 보안</text><text x="820.0" y="357.7" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">검사 실패</text><text x="820.0" y="380.7" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">[조사-벤더] Veracode 2025-07-30</text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="35.0" y="440.0">어느 근거도 실제 조직의 결과를 측정한 독립 연구는 아니다 (2026년 10월 기준)</tspan></text></svg>