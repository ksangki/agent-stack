<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="MCP 서버 유통의 두 단계와 사내 사설 레지스트리" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>MCP 서버 유통의 두 단계와 사내 사설 레지스트리</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="500" fill="#F5F6F8"/><rect x="20" y="40" width="290" height="300" rx="14" fill="none" stroke="#B4BBC8" stroke-width="1.8" stroke-dasharray="7 6"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="36.0" y="60.0">1단계 — 확인된 목록</tspan></text><rect x="330" y="40" width="650" height="300" rx="14" fill="none" stroke="#B4BBC8" stroke-width="1.8" stroke-dasharray="7 6"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="346.0" y="60.0">2단계 — 사용자가 고르는 곳</tspan></text><rect x="40" y="80" width="250" height="120" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="165.0" y="126.7" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">공식 MCP Registry</text><text x="165.0" y="148.9" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">메타데이터(server.json)·이름공간</text><text x="165.0" y="167.1" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">검증, 프리뷰</text><rect x="40" y="246" width="250" height="74" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="165.0" y="279.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">패키지 저장소</text><text x="165.0" y="300.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">npm · PyPI · Docker Hub</text><path d="M165,204 L165,242" fill="none" stroke="#1D2742" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5F6880" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="215.0" y="223.0">가리킨다</tspan></text><rect x="350" y="140" width="230" height="110" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="465.0" y="181.7" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">애그리게이터</text><text x="465.0" y="203.9" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">메타데이터를 받아</text><text x="465.0" y="222.1" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">큐레이션·평점·보안 스캔</text><path d="M294,175 L346,190" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="640" y="72" width="320" height="110" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="800.0" y="122.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">소비자형 디렉터리</text><text x="800.0" y="145.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">플랫폼이 리뷰하고 게시한다</text><rect x="640" y="206" width="320" height="114" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="800.0" y="249.7" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">기업형 디렉터리</text><text x="800.0" y="271.9" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">플랫폼이 받아 준 뒤 고객사 관리자가 승인해야</text><text x="800.0" y="290.2" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">사용자에게 보인다</text><path d="M584,180 L636,132" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M584,210 L636,258" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="20" y="380" width="520" height="92" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="280.0" y="421.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">사내 사설 레지스트리</text><text x="280.0" y="444.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">공식 레지스트리가 받지 않는 사내 MCP 서버를 모아 둔다 (같은 OpenAPI 구현)</text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="975.0" y="470.0">2026년 10월 기준</tspan></text></svg>