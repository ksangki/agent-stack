<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-label="좌석 위에 얹히는 크레딧과 외부 호출의 차감 경로" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>좌석 위에 얹히는 크레딧과 외부 호출의 차감 경로</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="450" fill="#F5F6F8"/><rect x="300" y="50" width="400" height="90" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="500.0" y="81.7" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">초과 과금</text><text x="500.0" y="103.9" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">할당을 넘은 사용 — 크레딧당 0.01달러, 기본값 켜짐이면 자동</text><text x="500.0" y="122.1" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">청구</text><rect x="300" y="160" width="400" height="110" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="500.0" y="210.5" fill="#1D2742" font-size="18" font-weight="700" text-anchor="middle">포함 크레딧</text><text x="500.0" y="234.1" fill="#5F6880" font-size="14.5" font-weight="400" text-anchor="middle">사용자당 월 할당 — 매달 새로 채워지고 이월 없음</text><rect x="300" y="290" width="400" height="90" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="500.0" y="330.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">기본 좌석</text><text x="500.0" y="353.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">사용자당 월 가격 — 사람 수를 센다</text><path d="M500,158 L500,144" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="560.0" y="151.0">할당을 다 쓰면</tspan></text><rect x="30" y="175" width="220" height="80" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="140.0" y="210.3" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">사람이 화면에서 쓰는 AI</text><text x="140.0" y="231.3" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">기능</text><rect x="750" y="175" width="220" height="80" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="860.0" y="210.3" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">외부 에이전트의 MCP·CLI</text><text x="860.0" y="231.3" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">호출</text><path d="M254,215 L296,215" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><path d="M746,215 L704,215" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><text fill="#B07812" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" y="196.0">차감</tspan></text><text fill="#B07812" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="725.0" y="196.0">차감</tspan></text><line x1="724" y1="54" x2="724" y2="136" stroke="#B07812" stroke-width="5"/><path d="M704,95 L720,95" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="750" y="55" width="220" height="80" rx="12" fill="#F3E5C6" stroke="#B4BBC8" stroke-width="1.8"/><text x="860.0" y="82.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">관리자 상한</text><text x="860.0" y="103.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">상한을 걸거나 초과 사용을 끈다</text><text x="860.0" y="120.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">(80%·100% 알림)</text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="420.0">Atlassian Rovo 크레딧 지원 문서(2026년 10월 기준)를 바탕으로 한 예시</tspan></text></svg>