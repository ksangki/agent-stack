<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="도구 호출 한 번의 경로와 에러가 갈라지는 두 지점" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>도구 호출 한 번의 경로와 에러가 갈라지는 두 지점</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="410" fill="#F5F6F8"/><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="975.0" y="30.0">MCP 2026-07-28판 기준</tspan></text><rect x="25" y="70" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="95.0" y="118.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">클라이언트</text><path d="M168,112 L184,112" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="187" y="70" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="257.0" y="99.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">인가</text><text x="257.0" y="120.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">scope·audience</text><text x="257.0" y="137.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">확인</text><path d="M330,112 L346,112" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="349" y="70" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="419.0" y="108.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">입력 검증</text><text x="419.0" y="129.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">요청 구조 확인</text><path d="M492,112 L508,112" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="511" y="70" width="140" height="84" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="581.0" y="118.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">실행</text><path d="M654,112 L670,112" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="673" y="70" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="743.0" y="118.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">출력 정제</text><path d="M816,112 L832,112" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="835" y="70" width="140" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="905.0" y="118.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">응답</text><rect x="20" y="250" width="300" height="104" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="170.0" y="290.1" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">403 insufficient_scope</text><text x="170.0" y="310.4" fill="#5F6880" font-size="12.0" font-weight="400" text-anchor="middle">필요한 scope를 함께 돌려줘 단계적</text><text x="170.0" y="326.6" fill="#5F6880" font-size="12.0" font-weight="400" text-anchor="middle">재인가(step-up)</text><path d="M257,158 L257,246" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M95,246 L95,158" fill="none" stroke="#1D2742" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5F6880" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="135.0" y="205.0">재인가</tspan></text><rect x="335" y="250" width="170" height="104" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="420.0" y="290.1" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">프로토콜 에러</text><text x="420.0" y="310.4" fill="#5F6880" font-size="12.0" font-weight="400" text-anchor="middle">JSON-RPC 에러, 요청</text><text x="420.0" y="326.6" fill="#5F6880" font-size="12.0" font-weight="400" text-anchor="middle">구조가 틀림</text><path d="M419,158 L419,246" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="520" y="250" width="270" height="104" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="655.0" y="298.2" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">실행 에러 isError: true</text><text x="655.0" y="318.5" fill="#5F6880" font-size="12.0" font-weight="400" text-anchor="middle">모델이 고쳐 다시 시도할 수 있는 피드백</text><path d="M581,158 L581,246" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><path d="M794,302 L905,302 L905,158" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="25.0" y="388.0">프로토콜 에러는 모델이 고치기 어렵고, 실행 에러는 결과에 담겨 돌아가 다음 호출의 근거가 된다</tspan></text></svg>